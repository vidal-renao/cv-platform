name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cv_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply schema
        run: psql -U postgres -d cv_platform_test -f schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm test -- --coverage
        env:
          JWT_SECRET: test_jwt_secret_32_chars_minimum_value
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cv_platform_test
          RESEND_API_KEY: re_test_key
      - name: DB integration tests
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cv_platform_test
          JWT_SECRET: test_jwt_secret_32_chars_minimum_value
          RESEND_API_KEY: re_test_key
      - name: Audit backend
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cv-platform-backend ./backend
      - name: Build frontend image
        run: docker build -t cv-platform-frontend ./frontend
